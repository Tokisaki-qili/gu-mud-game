<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蛊真人 - MUD文字冒险</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#c8c0a8;font-family:"Microsoft YaHei","SimSun",serif;height:100vh;overflow:hidden}
#game-container{display:flex;height:100vh;max-width:1400px;margin:0 auto}
#main-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid #2a2010;min-width:0}
#story-output{flex:1;overflow-y:auto;padding:20px;background:linear-gradient(180deg,#0d0d0d 0%,#141210 100%);line-height:1.9;font-size:16px;scroll-behavior:smooth}
#story-output .narrate{color:#b8a880}
#story-output .system{color:#5a8a5a}
#story-output .battle{color:#c04040}
#story-output .loot{color:#daa520}
#story-output .highlight{color:#ffd700;font-weight:bold}
#story-output .danger{color:#ff4444}
#story-output .cultivation{color:#8a6de9}
#story-output .gu-name{color:#40c0c0}
#story-output .achievement{color:#ff8c00}
#story-output .divider{color:#3a3020;margin:10px 0;display:block;text-align:center}
#choice-panel{padding:15px 20px;background:#0d0b08;border-top:2px solid #3a2810;min-height:80px}
#choice-panel .choices-title{color:#8a6a30;font-size:13px;margin-bottom:8px}
.choice-btn{display:block;width:100%;padding:12px 16px;margin:4px 0;background:linear-gradient(180deg,#1a1410,#0e0a06);border:1px solid #3a2810;color:#d4c090;text-align:left;cursor:pointer;font-size:15px;font-family:inherit;border-radius:3px;transition:all .2s}
.choice-btn:hover{background:linear-gradient(180deg,#2a1f10,#1a1008);border-color:#6a4a20;color:#ffe0a0;padding-left:24px}
.choice-btn:disabled{opacity:.4;cursor:not-allowed}
#side-panel{width:320px;display:flex;flex-direction:column;background:#0a0806;overflow-y:auto;padding:15px}
#side-panel h3{color:#8a6a30;font-size:15px;border-bottom:1px solid #2a2010;padding-bottom:8px;margin-bottom:10px}
.stat-row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.stat-label{color:#706848}
.stat-value{color:#c8b878;font-weight:bold}
.stat-value.rank{color:#8a6de9}
.stat-value.health{color:#40c040}
.stat-value.essence{color:#40a0c0}
.inv-item{padding:6px 8px;margin:3px 0;background:#0e0a06;border-left:3px solid #3a2810;font-size:13px;cursor:pointer;border-radius:0 3px 3px 0;transition:all .2s}
.inv-item:hover{background:#1a1208;border-left-color:#8a5a20}
.inv-item.gu-rank1{border-left-color:#808080}
.inv-item.gu-rank2{border-left-color:#40c040}
.inv-item.gu-rank3{border-left-color:#4080ff}
.inv-item.gu-rank4{border-left-color:#a040ff}
.inv-item.gu-rank5{border-left-color:#ff8040}
.inv-item.equip{border-left-color:#daa520}
.achievement-badge{display:inline-block;padding:3px 8px;margin:2px;background:#1a1000;border:1px solid #8a5a20;border-radius:10px;font-size:11px;color:#ff8c00}
#modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:100;justify-content:center;align-items:center}
#modal-overlay.active{display:flex}
#modal-box{background:#141210;border:2px solid #5a3a10;padding:25px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;border-radius:5px}
#modal-box h3{color:#daa520;margin-bottom:15px}
#modal-box .close-btn{float:right;background:none;border:none;color:#8a6a30;font-size:20px;cursor:pointer}
#modal-box button{padding:10px 20px;margin:5px;background:#2a1a08;border:1px solid #5a3a10;color:#daa520;cursor:pointer;border-radius:3px;font-family:inherit;font-size:14px}
#modal-box button:hover{background:#3a2a10}
#modal-box button:disabled{opacity:.4;cursor:not-allowed}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a0806}
::-webkit-scrollbar-thumb{background:#3a2810;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#5a3a15}
.action-bar{display:flex;gap:8px;padding:8px 20px;background:#0d0b08;border-bottom:1px solid #2a2010;flex-wrap:wrap}
.action-btn{padding:6px 14px;background:#1a1208;border:1px solid #3a2810;color:#b8a060;cursor:pointer;font-size:13px;font-family:inherit;border-radius:3px}
.action-btn:hover{background:#2a1a08;color:#e0c880}
.action-btn.active{background:#3a2008;border-color:#8a5a20;color:#ffd080}
.section-title{color:#5a4a20;font-size:12px;text-transform:uppercase;margin-top:12px;margin-bottom:4px;letter-spacing:1px}
.gu-slot{display:inline-block;width:48px;height:48px;margin:2px;background:#0e0a04;border:1px dashed #3a2810;border-radius:4px;text-align:center;line-height:44px;font-size:20px;vertical-align:top}
.gu-slot.filled{background:#1a1208;border:1px solid #4a3010;cursor:pointer}
.gu-slot.filled:hover{border-color:#8a5a20}
</style>
</head>
<body>
<div id="game-container">
  <div id="main-panel">
    <div class="action-bar" id="action-bar">
      <button class="action-btn" onclick="showInventory()">🎒 蛊虫袋</button>
      <button class="action-btn" onclick="showAperture()">💠 空窍</button>
      <button class="action-btn" onclick="showEquipment()">⚔️ 装备</button>
      <button class="action-btn" onclick="showFusion()">🔥 蛊虫融合</button>
      <button class="action-btn" onclick="showKillerMoves()">✨ 杀招</button>
      <button class="action-btn" onclick="showAchievements()">🏆 成就</button>
      <button class="action-btn" onclick="saveGame()">💾 存档</button>
      <button class="action-btn" onclick="loadGame()">📂 读档</button>
      <button class="action-btn" onclick="showHelp()">❓ 帮助</button>
    </div>
    <div id="story-output"></div>
    <div id="choice-panel"><span class="choices-title">等待故事开始...</span></div>
  </div>
  <div id="side-panel">
    <h3>📜 角色状态</h3>
    <div id="player-stats">
      <div class="stat-row"><span class="stat-label">姓名</span><span class="stat-value" id="stat-name">古月方源</span></div>
      <div class="stat-row"><span class="stat-label">修为</span><span class="stat-value rank" id="stat-rank">一转·初阶</span></div>
      <div class="stat-row"><span class="stat-label">生命</span><span class="stat-value health" id="stat-hp">100/100</span></div>
      <div class="stat-row"><span class="stat-label">真元</span><span class="stat-value essence" id="stat-essence">50/50</span></div>
      <div class="stat-row"><span class="stat-label">灵石</span><span class="stat-value" style="color:#daa520" id="stat-gold">0</span></div>
      <div class="stat-row"><span class="stat-label">攻击</span><span class="stat-value" style="color:#e04040" id="stat-atk">5</span></div>
      <div class="stat-row"><span class="stat-label">防御</span><span class="stat-value" style="color:#4080e0" id="stat-def">2</span></div>
      <div class="stat-row"><span class="stat-label">空窍容量</span><span class="stat-value" id="stat-aperture">3/5</span></div>
    </div>
    <div class="section-title">持有的蛊虫</div>
    <div id="gu-list"></div>
    <div class="section-title">🏆 成就</div>
    <div id="achievement-list"></div>
  </div>
</div>
<div id="modal-overlay"><div id="modal-box"></div></div>

<script>
// ==================== 游戏核心数据 ====================
const RANK_NAMES = ['','一转','二转','三转','四转','五转','六转','七转','八转','九转'];
const RANK_SUB = ['初阶','中阶','高阶','巅峰'];

const player = {
  name:'古月方源',
  rank:1, rankSub:0,
  hp:100, maxHp:100,
  essence:50, maxEssence:50,
  atk:5, def:2,
  gold:0,
  apertureSize:5,
  apertureSlots:[],
  inventory:[],
  equipment:{weapon:null,armor:null,accessory:null},
  achievements:[],
  killerMoves:[],
  storyFlags:{},
  combatCooldown:0,
};

// 蛊虫数据库
const GU_DATABASE = {
  '月光蛊':{rank:1,type:'attack',effect:'造成15点伤害',atk:15,essence:5,desc:'吸收月光精华，释放出一道银色光束攻击敌人'},
  '铁骨蛊':{rank:1,type:'buff',effect:'防御+5，持续3回合',def:5,duration:3,essence:8,desc:'让骨骼变得如钢铁般坚硬'},
  '春风蛊':{rank:1,type:'heal',effect:'恢复20点生命',heal:20,essence:6,desc:'引来一缕春风，治愈伤势'},
  '金蝉蛊':{rank:2,type:'special',effect:'脱壳保命，免疫一次致命伤害',essence:15,desc:'金蝉脱壳，保命神蛊'},
  '毒牙蛊':{rank:1,type:'attack',effect:'造成12点伤害并中毒',atk:12,poison:5,poisonDuration:3,essence:7,desc:'蕴含剧毒的蛊虫，咬伤敌人'},
  '石皮蛊':{rank:1,type:'buff',effect:'防御+8，持续3回合',def:8,duration:3,essence:8,desc:'皮肤化为石质，刀枪不入'},
  '火球蛊':{rank:2,type:'attack',effect:'造成25点火焰伤害',atk:25,essence:10,desc:'喷吐炙热火球，焚烧一切'},
  '冰晶蛊':{rank:2,type:'attack',effect:'造成20点伤害并减速',atk:20,slow:2,essence:9,desc:'释放极寒冰晶，冻结敌人'},
  '血炼蛊':{rank:2,type:'heal',effect:'消耗10生命恢复30生命',heal:30,cost:10,essence:12,desc:'以血为引，加速恢复'},
  '雷击蛊':{rank:3,type:'attack',effect:'造成40点雷击伤害',atk:40,essence:18,desc:'引动天雷，劈击敌人'},
  '金刚蛊':{rank:3,type:'buff',effect:'防御+20，攻击+10，持续3回合',def:20,atk:10,duration:3,essence:20,desc:'金刚之力加持，攻防一体'},
  '涅槃蛊':{rank:4,type:'special',effect:'死亡时自动复活并恢复50%生命',revive:0.5,essence:30,desc:'凤凰涅槃，浴火重生'},
};

// 蛊虫融合配方
const FUSION_RECIPES = [
  {inputs:['月光蛊','火球蛊'],output:'日月光蛊',outputRank:2,type:'attack',effect:'造成30点光焰伤害',atk:30,essenceCost:12},
  {inputs:['铁骨蛊','石皮蛊'],output:'不坏蛊',outputRank:2,type:'buff',effect:'防御+15，免疫中毒',def:15,duration:4,essenceCost:14},
  {inputs:['毒牙蛊','冰晶蛊'],output:'寒毒蛊',outputRank:3,type:'attack',effect:'造成25伤害+重度中毒',atk:25,poison:10,poisonDuration:3,essenceCost:16},
  {inputs:['火球蛊','雷击蛊'],output:'雷火蛊',outputRank:3,type:'attack',effect:'造成50点雷火伤害',atk:50,essenceCost:22},
  {inputs:['春风蛊','血炼蛊'],output:'甘霖蛊',outputRank:2,type:'heal',effect:'恢复40点生命',heal:40,essenceCost:10},
  {inputs:['金刚蛊','不坏蛊'],output:'金刚不坏蛊',outputRank:4,type:'buff',effect:'防御+30，攻击+20，持续4回合',def:30,atk:20,duration:4,essenceCost:28},
  {inputs:['日月光蛊','雷火蛊'],output:'天威蛊',outputRank:4,type:'attack',effect:'造成70点毁灭伤害',atk:70,essenceCost:30},
  {inputs:['寒毒蛊','天威蛊'],output:'灭世蛊',outputRank:5,type:'attack',effect:'造成100点伤害+全负面状态',atk:100,essenceCost:45},
];

// 杀招数据库
const KILLER_MOVES = {
  '月光斩':{req:'月光蛊',effect:'atk',multiplier:2.5,essence:15,desc:'以月光蛊为核心，凝聚月光之力斩出致命一击'},
  '雷火天降':{req:'雷火蛊',effect:'atk',multiplier:3,essence:25,desc:'雷火蛊全力催发，天降雷火毁灭一切'},
  '天威浩荡':{req:'天威蛊',effect:'atk',multiplier:4,essence:40,desc:'引动天地之威，释放灭世一击'},
  '不灭金身':{req:'金刚不坏蛊',effect:'def',multiplier:5,essence:30,desc:'金刚不坏，万法不侵'},
};

// 故事节点
const STORY = {
  'start':{
    text:'<span class="narrate">天空阴沉，古月山寨笼罩在薄雾之中。\n\n你——古月方源，古月山寨的一名普通少年，今日正是你参加"开窍大典"的日子。成功开窍，便能踏上蛊师之路；失败，则终生为凡。</span>\n\n<span class="system">族长古月博的声音在山寨广场上回荡："今日，是我古月山寨一年一度的开窍大典！凡年满十五岁的少年，皆可上前一试！"</span>\n\n你站在人群中，心跳如鼓。前方，那枚散发着幽光的"启灵蛊"正等待着你的触碰。',
    choices:[
      {text:'🎯 勇敢上前，触碰启灵蛊',next:'openAperture'},
      {text:'🤔 先观察其他人开窍的结果',next:'observeFirst'},
      {text:'💪 暗自运转体内气血，尝试自行冲窍',next:'selfOpen'},
    ]
  },
  'openAperture':{
    text:'<span class="narrate">你深吸一口气，迈步上前。手掌触碰到启灵蛊的瞬间，一股暖流涌入体内！</span>\n\n<span class="highlight">嗡——！</span>\n\n你的体内仿佛打开了一扇门！空窍——开辟成功！\n\n<span class="system">启灵蛊的光芒包裹着你，你感觉到自己的空窍中涌动着真元。古月博族长赞许地点头："很好，方源，你的空窍资质不错，有五成空窍！"</span>\n\n<span class="loot">🎉 你正式成为一名蛊师！修为：一转·初阶</span>\n\n<span class="system">族长赐予了你一只入门蛊虫——月光蛊。</span>',
    choices:[
      {text:'✨ 接受月光蛊，开始修炼',next:'receiveMoonlight',reward:{gu:'月光蛊'}},
      {text:'🙏 谦逊推辞，请求自行寻找蛊虫',next:'refuseGu'},
    ],
    onEnter(){player.storyFlags.openedAperture=true;player.storyFlags.apertureQuality='五成';addLog('system','空窍开辟！容量：5')},
  },
  'observeFirst':{
    text:'<span class="narrate">你选择暂退一步，观察他人。几名少年先后上前。</span>\n\n古月赤虎——开辟失败，黯然退下。\n古月兰——成功开辟，三成空窍。\n古月铁——开辟失败。\n\n<span class="system">你注意到，那些内心平静、气息沉稳的人成功率更高。这个发现让你多了一分把握。</span>\n\n终于轮到了你。',
    choices:[
      {text:'🎯 怀着信心，上前触碰启灵蛊',next:'openAperture'},
    ]
  },
  'selfOpen':{
    text:'<span class="narrate">你暗中运转体内气血，试图不依靠启灵蛊自行冲开空窍！</span>\n\n<span class="danger">剧痛传来！</span>这几乎是自杀行为——但你咬牙坚持。\n\n就在你即将昏厥的瞬间，体内某处轰然洞开！\n\n<span class="highlight">自行开窍成功！</span>\n\n<span class="system">虽然痛苦万分，但你的空窍比常人更大——高达七成空窍！古月博族长大惊失色："自...自行开窍？！此子不凡！"</span>\n\n<span class="loot">🎉 你成为了山寨中的传奇！修为：一转·初阶 | 空窍容量：7</span>',
    choices:[
      {text:'✨ 虽然虚弱，但自豪地接受这份力量',next:'selfOpenReward',reward:{gu:'月光蛊',gu2:'铁骨蛊'}},
    ],
    onEnter(){player.storyFlags.openedAperture=true;player.storyFlags.apertureQuality='七成';player.apertureSize=7;player.hp-=20;addLog('system','自行开窍成功！空窍容量：7（-20生命）')},
  },
  'receiveMoonlight':{
    text:'<span class="narrate">你将月光蛊收入空窍。这只蛊虫通体银白，散发着柔和的月光。从今日起，你便是一名真正的蛊师了。</span>\n\n<span class="system">接下来，你需要选择自己的修炼方向。古月山寨周围危机四伏，但也充满机遇。</span>',
    choices:[
      {text:'🏔️ 前往山寨外的翠微山历练',next:'cuishanMountain'},
      {text:'📚 去藏经阁学习蛊师基础知识',next:'library'},
      {text:'🤝 与其他少年蛊师交流切磋',next:'sparWithPeers'},
      {text:'🕵️ 探索山寨中的秘密',next:'villageSecret'},
    ]
  },
  'selfOpenReward':{
    text:'<span class="narrate">你获得了月光蛊和铁骨蛊。虽然身体虚弱，但双蛊在手，空窍广阔，前途不可限量。</span>\n\n<span class="system">古月博族长私下找到你："方源，你的天赋非同寻常。我有一事相托..."</span>',
    choices:[
      {text:'👂 认真倾听族长的委托',next:'chiefQuest'},
      {text:'🏔️ 先养好伤，独自去翠微山历练',next:'cuishanMountain'},
    ]
  },
  'library':{
    text:'<span class="narrate">藏经阁中，古老的竹简堆积如山。你翻阅着关于蛊虫培育、真元修炼的基础法门。</span>\n\n<span class="system">你学到了重要的知识：\n• 蛊虫需要喂养真元才能成长\n• 不同蛊虫之间可以融合，产生更强大的蛊虫\n• 修为分为九转，每提升一转都需要渡劫\n• 仙道杀招是将蛊虫之力发挥到极致的秘法</span>\n\n<span class="loot">知识就是力量！你感觉对蛊道的理解加深了。</span>',
    choices:[
      {text:'🏔️ 带着新知识，前往翠微山历练',next:'cuishanMountain'},
      {text:'🧪 尝试用学到的知识融合蛊虫',next:'fusionAttempt1',condition:()=>player.inventory.filter(g=>g.rank<=2).length>=2},
      {text:'🤝 去和其他蛊师交流',next:'sparWithPeers'},
    ]
  },
  'sparWithPeers':{
    text:'<span class="narrate">演武场上，几名少年蛊师正在互相切磋。</span>\n\n古月赤虎虽然开窍失败，但他身体强壮，凭借蛮力也能一战。\n古月兰则驱使着她的"春风蛊"为大家治疗。\n\n<span class="system">你参与了几场切磋，对自己的蛊虫运用有了更深的理解。</span>',
    choices:[
      {text:'⚔️ 挑战古月赤虎（切磋战斗）',next:'fightRedTiger'},
      {text:'💬 向古月兰请教治疗之术',next:'learnHealing'},
      {text:'🏔️ 独自前往翠微山',next:'cuishanMountain'},
    ]
  },
  'villageSecret':{
    text:'<span class="narrate">夜深人静，你悄悄探索山寨中的隐秘角落。在后山的一处废弃矿洞中，你发现了一些不寻常的痕迹...</span>\n\n<span class="danger">矿洞深处传来低沉的嘶吼声！一只野生的"毒牙蛊"正盘踞在此！</span>',
    choices:[
      {text:'⚔️ 尝试收服这只蛊虫',next:'tamePoisonFang'},
      {text:'🏃 安全起见，悄悄退出去',next:'cuishanMountain'},
      {text:'🔍 继续深入矿洞探索',next:'mineDeep'},
    ]
  },

// ==================== 渲染引擎 ====================
let currentNode='start';
let choicesVisible=true;

function getNode(nodeId){
  if(!STORY[nodeId])return STORY['villageHub'];
  return STORY[nodeId];
}

function renderNode(nodeId){
  currentNode=nodeId;
  const node=getNode(nodeId);
  if(node.condition && !node.condition()){renderNode('villageHub');return;}
  if(node.onEnter)node.onEnter();
  const out=document.getElementById('story-output');
  const divider='<span class="divider">━━━━━━━━━━━━━━━━━━━━━━</span>';
  out.innerHTML+=divider+'<br>'+node.text.replace(/\n/g,'<br>')+'<br><br>';
  out.scrollTop=out.scrollHeight;
  renderChoices(node);
  updateUI();
  // 自动存档（不在战斗中和起点）
  if(nodeId!=='start' && !combatState) {
    autoSave();
  }
}

function renderChoices(node){
  const panel=document.getElementById('choice-panel');
  panel.innerHTML='<span class="choices-title">请选择你的行动：</span>';
  if(!node.choices)return;
  const validChoices=node.choices.filter(c=>{
    if(c.condition && !c.condition())return false;
    return true;
  });
  if(validChoices.length===0){validChoices.push(...node.choices);}
  validChoices.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.textContent=c.text;
    btn.onclick=()=>{handleChoice(c)};
    panel.appendChild(btn);
  });
}

function handleChoice(choice){
  if(!choice)return;
  if(choice.reward){
    if(choice.reward.gu)addGuToInventory(choice.reward.gu);
    if(choice.reward.gu2)addGuToInventory(choice.reward.gu2);
  }
  if(choice.cost){
    if(choice.cost.essence)player.essence-=choice.cost.essence;
    if(player.essence<0)player.essence=0;
  }
  if(choice.setFlag)player.storyFlags[choice.setFlag]=true;
  if(choice.combat){
    startCombat(choice.combat);
    return;
  }
  if(choice.buy){
    handleBuy(choice.buy);
    return;
  }
  if(choice.fusion){
    showFusion();
    return;
  }
  if(choice.showAchievements){
    showAchievements();
    return;
  }
  renderNode(choice.next||currentNode);
}

// ==================== 战斗系统 ====================
let combatState=null;

function startCombat(combatDef){
  combatState={
    enemy:{...combatDef},
    turn:0,
    playerBuffs:[],
    enemyBuffs:[],
    combatDef:combatDef,
    log:[],
  };
  const out=document.getElementById('story-output');
  out.innerHTML+='<span class="divider">━━━━━━━━━━━━━━━━━━━━━━</span><br>';
  out.innerHTML+='<span class="battle">⚔️ 战斗开始！对手：'+combatDef.name+' | HP:'+combatDef.hp+'</span><br><br>';
  out.scrollTop=out.scrollHeight;
  showCombatChoices();
}

function showCombatChoices(){
  const panel=document.getElementById('choice-panel');
  const e=combatState.enemy;
  panel.innerHTML='<span class="choices-title">⚔️ 战斗回合 | '+e.name+' HP:'+e.hp+'/'+combatState.combatDef.hp+'</span>';
  const guInAperture=player.apertureSlots.filter(g=>g);
  guInAperture.forEach((gu,i)=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.innerHTML='🐛 <span class="gu-name">'+gu.name+'</span> - '+gu.effect+' | 消耗'+gu.essence+'真元';
    btn.onclick=()=>{useGuInCombat(i)};
    if(player.essence<gu.essence)btn.disabled=true;
    panel.appendChild(btn);
  });
  const basicBtn=document.createElement('button');
  basicBtn.className='choice-btn';
  basicBtn.textContent='👊 普通攻击（无消耗）';
  basicBtn.onclick=()=>{basicAttack()};
  panel.appendChild(basicBtn);
  // 杀招
  player.killerMoves.forEach(km=>{
    const kmData=KILLER_MOVES[km];
    if(!kmData)return;
    const hasGu=player.apertureSlots.some(g=>g&&g.name===kmData.req);
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.innerHTML='✨ <span class="cultivation">'+km+'</span> - '+kmData.desc+' | 消耗'+kmData.essence+'真元';
    btn.onclick=()=>{useKillerMove(km)};
    if(!hasGu||player.essence<kmData.essence)btn.disabled=true;
    panel.appendChild(btn);
  });
}

function basicAttack(){
  const dmg=Math.max(1,player.atk-combatState.enemy.def+Math.floor(Math.random()*5));
  combatState.enemy.hp-=dmg;
  addCombatLog('你对'+combatState.enemy.name+'造成了'+dmg+'点伤害！');
  checkCombatEnd();
  if(combatState)enemyTurn();
}

function useGuInCombat(idx){
  const gu=player.apertureSlots[idx];
  if(!gu||player.essence<gu.essence)return;
  player.essence-=gu.essence;
  let dmg=gu.atk||0;
  dmg=Math.max(1,dmg-combatState.enemy.def+Math.floor(Math.random()*8));
  combatState.enemy.hp-=dmg;
  addCombatLog('你使用<span class="gu-name">'+gu.name+'</span>造成'+dmg+'点伤害！');
  if(gu.poison){
    combatState.enemyBuffs.push({type:'poison',dmg:gu.poison,duration:gu.poisonDuration});
    addCombatLog(combatState.enemy.name+'中毒了！每回合损失'+gu.poison+'生命');
  }
  if(gu.slow){
    combatState.enemyBuffs.push({type:'slow',amount:gu.slow,duration:2});
  }
  if(gu.type==='buff'){
    combatState.playerBuffs.push({type:'def',amount:gu.def||0,duration:gu.duration||3});
    if(gu.atk)combatState.playerBuffs.push({type:'atk',amount:gu.atk,duration:gu.duration||3});
    addCombatLog('你的防御和攻击提升了！');
  }
  if(gu.type==='heal'){
    player.hp+=gu.heal||20;if(player.hp>player.maxHp)player.hp=player.maxHp;
    addCombatLog('你恢复了'+(gu.heal||20)+'生命！');
  }
  checkCombatEnd();
  if(combatState)enemyTurn();
}

function useKillerMove(kmName){
  const kmData=KILLER_MOVES[kmName];
  if(!kmData)return;
  player.essence-=kmData.essence;
  let dmg=Math.floor(player.atk*kmData.multiplier)-combatState.enemy.def+Math.floor(Math.random()*10);
  dmg=Math.max(1,dmg);
  combatState.enemy.hp-=dmg;
  addCombatLog('<span class="cultivation">✨ '+kmName+'！</span>造成<span class="highlight">'+dmg+'</span>点伤害！');
  checkCombatEnd();
  if(combatState)enemyTurn();
}

function enemyTurn(){
  const ticks=()=>{
    // 处理buff
    combatState.enemyBuffs=combatState.enemyBuffs.filter(b=>{
      if(b.type==='poison'){
        combatState.enemy.hp-=b.dmg;
        addCombatLog(combatState.enemy.name+'受到'+b.dmg+'点中毒伤害');
      }
      b.duration--;return b.duration>0;
    });
    if(combatState.enemy.hp<=0){checkCombatEnd();return;}
  };
  ticks();
  if(!combatState)return;
  const eAtk=combatState.enemy.atk;
  let playerDef=player.def;
  combatState.playerBuffs.forEach(b=>{if(b.type==='def')playerDef+=b.amount});
  const dmg=Math.max(1,eAtk-playerDef+Math.floor(Math.random()*5));
  player.hp-=dmg;
  addCombatLog(combatState.enemy.name+'攻击你造成'+dmg+'点伤害！');
  if(player.storyFlags.learnedHealing){player.hp+=3;if(player.hp>player.maxHp)player.hp=player.maxHp;}
  // 减少buff
  combatState.playerBuffs=combatState.playerBuffs.filter(b=>{b.duration--;return b.duration>0;});
  if(player.hp<=0){
    // 检查涅槃蛊
    const hasNirvana=player.apertureSlots.some(g=>g&&g.name==='涅槃蛊');
    if(hasNirvana){
      player.hp=Math.floor(player.maxHp*0.5);
      addCombatLog('<span class="highlight">🦅 涅槃蛊发动！你浴火重生！</span>');
      updateUI();
      showCombatChoices();
      return;
    }
    if(player.apertureSlots.some(g=>g&&g.name==='金蝉蛊')){
      player.hp=1;
      addCombatLog('<span class="highlight">🦗 金蝉蛊发动！金蝉脱壳！</span>');
      updateUI();
      showCombatChoices();
      return;
    }
    addCombatLog('<span class="danger">你倒下了...</span>');
    endCombat(false);
    return;
  }
  updateUI();
  showCombatChoices();
}

function addCombatLog(msg){
  const out=document.getElementById('story-output');
  out.innerHTML+='<span class="battle">'+msg+'</span><br>';
  out.scrollTop=out.scrollHeight;
}

function checkCombatEnd(){
  if(combatState.enemy.hp<=0){
    addCombatLog('<span class="highlight">🎉 你击败了'+combatState.enemy.name+'！</span>');
    endCombat(true);
  }
}

function endCombat(won){
  const def=combatState.combatDef;
  combatState=null;
  const out=document.getElementById('story-output');
  out.innerHTML+='<span class="divider">━━━━━━━━━━━━━━━━━━━━━━</span><br>';
  out.scrollTop=out.scrollHeight;
  updateUI();
  if(won&&def.onWin){
    if(def.reward==='gu'||def.reward==='both'){
      if(def.rewardGu)addGuToInventory(def.rewardGu);
    }
    if(def.reward==='special'||def.reward==='both'){
      if(def.specialReward==='nirvana')addGuToInventory('涅槃蛊');
      if(def.specialReward==='equip'){}
    }
    if(def.rewardGold)player.gold+=def.rewardGold;
    addLog('loot','战斗胜利！');
    handleAutoAchievements(def.onWin);
    renderNode(def.onWin);
  }else if(!won){
    player.hp=Math.floor(player.maxHp*0.3);
    player.essence=Math.floor(player.maxEssence*0.3);
    renderNode('villageHub');
    addLog('system','战斗失败，返回山寨休整');
  }
}

function handleAutoAchievements(onWin){
  if(onWin==='defeatedStoneDemon'&&!player.achievements.includes('石魔杀手'))player.achievements.push('石魔杀手');
  if(onWin==='blessedCoreWin'&&!player.achievements.includes('福地之主'))player.achievements.push('福地之主');
  if(onWin==='banditDefeated'&&!player.achievements.includes('为民除害'))player.achievements.push('为民除害');
}

function addGuToInventory(guName){
  const data=GU_DATABASE[guName];
  if(!data)return;
  const gu={name:guName,rank:data.rank,type:data.type,effect:data.effect,atk:data.atk||0,def:data.def||0,essence:data.essence||5,poison:data.poison||0,poisonDuration:data.poisonDuration||0,slow:data.slow||0,duration:data.duration||0,heal:data.heal||0,revive:data.revive||0,desc:data.desc};
  player.inventory.push(gu);
  if(player.apertureSlots.length<player.apertureSize){
    player.apertureSlots.push(gu);
    addLog('system','已将'+guName+'自动装备到空窍');
  }else{
    addLog('system','获得'+guName+'（空窍已满，需手动管理）');
  }
  updateUI();
}

function handleBuy(buy){
  if(player.gold<buy.price){
    addLog('system','灵石不足！需要'+buy.price+'灵石');
    renderNode('shop');
    return;
  }
  player.gold-=buy.price;
  if(buy.type==='equip'){
    if(buy.slot==='weapon'){player.equipment.weapon=buy.item;player.atk+=buy.stats.atk||0;}
    if(buy.slot==='armor'){player.equipment.armor=buy.item;player.def+=buy.stats.def||0;}
    if(buy.slot==='accessory'){player.equipment.accessory=buy.item;player.maxEssence+=buy.stats.maxEssence||0;player.essence+=buy.stats.maxEssence||0;}
    addLog('loot','购买装备：'+buy.item);
  }else{
    addGuToInventory(buy.item);
    addLog('loot','购买蛊虫：'+buy.item);
  }
  updateUI();
  renderNode('shop');
}

function showFusion(){

  html+='<p style="color:#8a6a30;font-size:13px;">选择两只蛊虫进行融合（融合后原蛊虫消失）</p>';
  const available=player.inventory.slice();
  if(available.length<2){
    html+='<p style="color:#c04040;">需要至少两只蛊虫才能融合！</p>';
  }else{
    html+='<p>可用的融合配方：</p>';
    FUSION_RECIPES.forEach(recipe=>{
      const hasAll=recipe.inputs.every(name=>available.some(g=>g.name===name));
      html+='<button '+(hasAll?'':'disabled')+' onclick="executeFusion(\''+recipe.inputs.join("','")+'\',\''+recipe.output+'\','+recipe.outputRank+',\''+(recipe.atk||'')+'\','+(recipe.def||0)+','+(recipe.essenceCost||10)+',\''+(recipe.effect||'')+'\','+(recipe.poison||0)+','+recipe.poisonDuration+',\''+recipe.type+'\')">';
      html+=recipe.inputs.join(' + ')+' → <span class="gu-name">'+recipe.output+'</span>（'+RANK_NAMES[recipe.outputRank]+'）';
      if(!hasAll)html+=' <span style="color:#c04040;">（材料不足）</span>';
      html+='</button>';
    });
  }
  html+='<br><button onclick="closeModal()">关闭</button>';
  box.innerHTML=html;
  modal.classList.add('active');
}

function executeFusion(input1,input2,output,outputRank,atkStr,def,essenceCost,effect,poison,poisonDuration,type){
  const g1=player.inventory.find(g=>g.name===input1);
  const g2=player.inventory.find(g=>g.name===input2);
  if(!g1||!g2)return;
  player.inventory=player.inventory.filter(g=>g!==g1&&g!==g2);
  player.apertureSlots=player.apertureSlots.map(g=>(g===g1||g===g2)?null:g).filter(Boolean);
  const newGu={
    name:output,rank:outputRank,type:type,effect:effect,
    atk:parseInt(atkStr)||0,def:def,essence:essenceCost,
    poison:poison||0,poisonDuration:poisonDuration||0,
    desc:'融合蛊虫，威力强大',
    heal:type==='heal'?parseInt(atkStr)||0:0,
    slow:0,duration:type==='buff'?4:0,revive:0
  };
  player.inventory.push(newGu);
  if(player.apertureSlots.length<player.apertureSize){
    player.apertureSlots.push(newGu);
  }
  addLog('loot','✨ 融合成功！获得<span class="gu-name">'+output+'</span>（'+RANK_NAMES[outputRank]+'）！');
  if(!player.achievements.includes('蛊虫炼师'))player.achievements.push('蛊虫炼师');
  closeModal();
  updateUI();
  renderNode('villageHub');
}

function toggleEquip(idx){
  const gu=player.inventory[idx];
  if(!gu)return;
  const slotIdx=player.apertureSlots.indexOf(gu);
  if(slotIdx>=0){
    player.apertureSlots.splice(slotIdx,1);
    addLog('system','卸下蛊虫：'+gu.name);
  }else{
    if(player.apertureSlots.length>=player.apertureSize){
      addLog('system','空窍已满！请先卸下其他蛊虫');
      return;
    }
    player.apertureSlots.push(gu);
    addLog('system','装备蛊虫：'+gu.name);
  }
  updateUI();
  showInventory();
}

function unequipGu(idx){
  if(idx<player.apertureSlots.length){
    const gu=player.apertureSlots[idx];
    player.apertureSlots.splice(idx,1);
    addLog('system','卸下蛊虫：'+gu.name);
    updateUI();
  }
}

// ==================== 存档系统 ====================
const SAVE_KEY = 'gu_mud_save_v2';
const AUTO_SAVE_KEY = 'gu_mud_autosave_v2';
const MAX_SAVES = 5;

function saveGame(slot){
  if(!slot) slot = 0;
  const saveData = {
    version: 2,
    timestamp: new Date().toLocaleString('zh-CN'),
    player: {
      rank: player.rank, rankSub: player.rankSub,
      hp: player.hp, maxHp: player.maxHp,
      essence: player.essence, maxEssence: player.maxEssence,
      atk: player.atk, def: player.def,
      gold: player.gold,
      apertureSize: player.apertureSize,
      apertureSlotNames: player.apertureSlots.map(g=>g?g.name:null).filter(Boolean),
      inventoryNames: player.inventory.map(g=>g.name),
      equipment: {...player.equipment},
      achievements: [...player.achievements],
      killerMoves: [...player.killerMoves],
      storyFlags: {...player.storyFlags},
    },
    currentNode: currentNode,
    storyHTML: document.getElementById('story-output').innerHTML,
  };
  const key = slot === 0 ? AUTO_SAVE_KEY : (SAVE_KEY + '_' + slot);
  localStorage.setItem(key, JSON.stringify(saveData));
  addLog('system', slot === 0 ? '💾 自动存档成功！' : '💾 存档位 '+slot+' 保存成功！');
  return true;
}

function autoSave(){
  saveGame(0);
}

function loadGame(){
  const modal = document.getElementById('modal-overlay');
  const box = document.getElementById('modal-box');
  let html = '<h3>📂 读取存档</h3>';
  let hasAny = false;

  // 检查自动存档
  const autoData = localStorage.getItem(AUTO_SAVE_KEY);
  if (autoData) {
    hasAny = true;
    try {
      const d = JSON.parse(autoData);
      html += '<button onclick="restoreSave(\''+AUTO_SAVE_KEY+'\')" style="display:block;width:100%;text-align:left;padding:12px;margin:6px 0;background:#1a1208;border:1px solid #3a2810;color:#daa520;border-radius:3px;cursor:pointer">';
      html += '🟢 <b>自动存档</b><br>';
      html += '<span style="font-size:12px;color:#8a6a30">' + d.timestamp + ' | 修为：' + RANK_NAMES[d.player.rank] + '·' + RANK_SUB[d.player.rankSub] + ' | 灵石：' + d.player.gold + '</span>';
      html += '</button>';
    } catch(e) {}
  }

  // 检查手动存档
  for (let i = 1; i <= MAX_SAVES; i++) {
    const key = SAVE_KEY + '_' + i;
    const data = localStorage.getItem(key);
    if (data) {
      hasAny = true;
      try {
        const d = JSON.parse(data);
        html += '<button onclick="restoreSave(\''+key+'\')" style="display:block;width:100%;text-align:left;padding:12px;margin:6px 0;background:#1a1208;border:1px solid #3a2810;color:#daa520;border-radius:3px;cursor:pointer">';
        html += '📁 <b>存档位 ' + i + '</b><br>';
        html += '<span style="font-size:12px;color:#8a6a30">' + d.timestamp + ' | 修为：' + RANK_NAMES[d.player.rank] + '·' + RANK_SUB[d.player.rankSub] + ' | 灵石：' + d.player.gold + '</span>';
        html += '</button>';
      } catch(e) {}
    }
  }

  if (!hasAny) {
    html += '<p style="color:#888;">暂无存档。开始冒险后会自动存档。</p>';
    html += '<p style="color:#8a6a30;font-size:12px;">💡 游戏会在每次关键事件后自动存档。你也可以点击 💾 存档按钮手动保存到存档位。</p>';
  } else {
    html += '<p style="color:#888;font-size:11px;margin-top:8px;">💡 点击存档即可读取。自动存档会在关键事件后更新。</p>';
  }

  // 手动存档选择
  html += '<br><div style="display:flex;gap:6px;flex-wrap:wrap">';
  for (let i = 1; i <= MAX_SAVES; i++) {
    html += '<button onclick="saveGame('+i+');closeModal();setTimeout(()=>showAchievements(),300)" style="flex:1;min-width:40px;padding:8px">💾 存档'+i+'</button>';
  }
  html += '</div>';
  html += '<br><button onclick="closeModal()" style="width:100%">关闭</button>';

  box.innerHTML = html;
  modal.classList.add('active');
}

function restoreSave(key){
  const raw = localStorage.getItem(key);
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    // 恢复player状态
    const p = d.player;
    player.rank = p.rank; player.rankSub = p.rankSub;
    player.hp = p.hp; player.maxHp = p.maxHp;
    player.essence = p.essence; player.maxEssence = p.maxEssence;
    player.atk = p.atk; player.def = p.def;
    player.gold = p.gold;
    player.apertureSize = p.apertureSize;
    player.equipment = { ...p.equipment };
    player.achievements = [...p.achievements];
    player.killerMoves = [...p.killerMoves];
    player.storyFlags = { ...p.storyFlags };

    // 重建inventory
    player.inventory = [];
    p.inventoryNames.forEach(name => {
      const data = GU_DATABASE[name];
      if (data) {
        player.inventory.push({
          name, rank: data.rank, type: data.type, effect: data.effect,
          atk: data.atk || 0, def: data.def || 0, essence: data.essence || 5,
          poison: data.poison || 0, poisonDuration: data.poisonDuration || 0,
          slow: data.slow || 0, duration: data.duration || 0,
          heal: data.heal || 0, revive: data.revive || 0, desc: data.desc
        });
      }
    });

    // 重建apertureSlots
    player.apertureSlots = [];
    p.apertureSlotNames.forEach(name => {
      const gu = player.inventory.find(g => g.name === name);
      if (gu && player.apertureSlots.length < player.apertureSize) {
        player.apertureSlots.push(gu);
      }
    });

    // 恢复故事
    currentNode = d.currentNode;
    document.getElementById('story-output').innerHTML = d.storyHTML || '';
    document.getElementById('story-output').scrollTop = document.getElementById('story-output').scrollHeight;

    closeModal();
    updateUI();
    addLog('system', '📂 存档读取成功！欢迎回来，蛊师 ' + player.name);
    addLog('system', '修为：' + RANK_NAMES[player.rank] + '·' + RANK_SUB[player.rankSub] + ' | 灵石：' + player.gold);

    // 渲染当前节点的选择
    const node = getNode(currentNode);
    if (node) renderChoices(node);
  } catch(e) {
    addLog('system', '❌ 存档损坏，无法读取');
  }
}

function hasSaveData(){
  for (let i = 1; i <= MAX_SAVES; i++) {
    if (localStorage.getItem(SAVE_KEY + '_' + i)) return true;
  }
  return !!localStorage.getItem(AUTO_SAVE_KEY);
}

function addLog(type,msg){
  const out=document.getElementById('story-output');
  const clsMap={system:'system',loot:'loot',cultivation:'cultivation'};
  const cls=clsMap[type]||'narrate';
  out.innerHTML+='<span class="'+cls+'">['+type+'] '+msg+'</span><br>';
  out.scrollTop=out.scrollHeight;
}

// ==================== 初始化 ====================
function init(){
  document.getElementById('modal-overlay').onclick=function(e){
    if(e.target===this)closeModal();
  };
  addGuToInventory('月光蛊');
  updateUI();
  renderNode('start');
}
init();
</script>
